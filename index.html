  <body>
    <div id="root"></div>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
      
      // Detect and mark TWA mode
      (function() {
        var isTWA = document.referrer.includes('android-app://') || 
                    window.matchMedia('(display-mode: standalone)').matches;
        if (isTWA) {
          document.documentElement.classList.add('twa-mode');
          localStorage.setItem('app_source', 'playstore');
        }
      })();
    </script>

    <script>
      // Register Service Worker for PWA and caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js');
            
            // Handle service worker updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker is available, refresh the page
                    window.location.reload();
                  }
                });
              }
            });

            // Check for updates periodically
            setInterval(() => {
              registration.update();
            }, 60000); // Check every minute

          } catch (error) {
            // Silently fail if service worker registration fails
            console.log('Service worker registration failed:', error);
          }
        });

        // Handle service worker messages
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'CACHE_UPDATED') {
            // Cache has been updated, could show a notification to user
            console.log('Cache updated');
          }
        });
      }
    </script>
