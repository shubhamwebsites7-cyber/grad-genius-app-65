  <meta property="og:title" content="GoalGrip - Health & Productivity Tracker">
  <meta name="twitter:title" content="GoalGrip - Health & Productivity Tracker">
  <meta property="og:description" content="GoalGrip is your all-in-one health & productivity companion. Track calories, monitor weight, manage tasks, set goals, and build exercise habits.">
  <meta name="twitter:description" content="GoalGrip is your all-in-one health & productivity companion. Track calories, monitor weight, manage tasks, set goals, and build exercise habits.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered successfully');
              
              // Check for updates every 60 seconds
              setInterval(() => {
                registration.update();
              }, 60000);

              // Handle service worker updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker available, reload the page
                    console.log('New version available! Reloading...');
                    window.location.reload();
                  }
                });
              });
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });

          // Handle controller change (when new SW takes over)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
