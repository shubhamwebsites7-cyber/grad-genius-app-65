<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Tracker</title>
    <meta name="description" content="Track your calories, monitor weight goals, todo list, strike and maintain a healthy lifestyle with TrackMyCalories - your personal health companion.">
    <meta name="author" content="TrackMyCalories App" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TrackMyCalories" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons -->
    <link rel="icon" href="/pwa-192x192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="/pwa-512x512.png" />
    <meta property="og:title" content="Personal Tracker">
  <meta name="twitter:title" content="Personal Tracker">
  <meta property="og:description" content="Track your calories, monitor weight goals, todo list, strike and maintain a healthy lifestyle with TrackMyCalories - your personal health companion.">
  <meta name="twitter:description" content="Track your calories, monitor weight goals, todo list, strike and maintain a healthy lifestyle with TrackMyCalories - your personal health companion.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
